syntax = "proto3";

option java_package = "md.ramaiana.foodmarket.proto";
option java_outer_classname = "Orders";

import "Clients.proto";
import "Common.proto";

message Order {
  // 0 - for new order
  int32 id = 1;
  float totalSum = 2;
  Client client = 3;
  OrderState state = 4;
  // date in millis for UTC timezone
  int64 date = 5;
  float totalWeight = 6;
  repeated OrderProduct products = 7;
}

message OrderProduct {
  int32 productId = 1;
  float quantity = 2;
  float sum = 3;
  float weight = 4;
  string productName = 5;
}

message AddProductToOrderRequest {
  int32 orderId = 1; // could be 0, in this case new order is created
  int32 productId = 2;
  float quantity = 3;
  int32 clientId = 4;
}

message DeleteProductFromOrderRequest {
  int32 orderId = 1;
  int32 orderProductId = 2;
}

message GetOrderByIdRequest {
  int32 orderId = 1;
}

message UpdateOrderRequest {
  int32 orderId = 1;
  int32 productId = 2;
  float newQuantity = 3;
}

message DeleteOrderRequest {
  int32 orderId = 1;
}

message AddProductToOrderResponse {
  Order order = 1;
}

message OrderListRequest {
  // date in millis
  int64 dateFrom = 1;
  // date in millis
  int64 dateTo = 2;
  int32 clientId = 3;
  Pagination pagination = 4;
  Sorting sorting = 5;
}

message OrdersListResponse {
  repeated Order orders = 1;
  Pagination pagination = 2;
}

message PlaceOrderRequest {
  int32 orderId = 1;
}

enum OrderState {
  NEW = 0;
  PROCESSED = 1;
  NOT_PROCESSED = 2;
  ERRONEOUS = 3;
}
