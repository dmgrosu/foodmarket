spring:
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET search_path TO rama_fm

jwt:
  token:
    secret: kldfnb9b0934nv^*(NJk$$l,dde
    validity: 3600000

# data loading folder path
dataFolderPath: ${DATA_FOLDER_PATH}
# data loading delay in millis, default 10000 (10 sec)
dataLoadingDelay: 10000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

mailjet:
  enabled: ${MAILJET_ENABLED:true}
  base-url: ${MAILJET_BASE_URL:https://api.mailjet.com}
  api-key: ${MAILJET_API_KEY:}
  secret-key: ${MAILJET_SECRET_KEY:}
  connect-timeout-ms: 5000
  read-timeout-ms: 10000
  sender:
    email: ${MAILJET_SENDER_EMAIL:}
    name: ${MAILJET_SENDER_NAME:Ramaiana Foodmarket}

registration:
  confirmation-page-url: ${REGISTRATION_CONFIRMATION_PAGE_URL:http://localhost:3000/confirmEmail}
  confirmation-link-validity-hours: 24
  resend-cooldown-seconds: 60
  login-page-url: ${REGISTRATION_LOGIN_PAGE_URL:http://localhost:3000/signIn}
