spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password: sa
  sql:
    init:
      mode: always

jwt:
  token:
    secret: ffffffff
    validity: 3600000

# Scheduling is on app-wide in tests, so ScheduleDataService runs the importers AND the order
# exporter on this folder every cycle. Pointed at target/ so a run cannot write files into the
# source tree; tests that exercise the exchange set their own folder and lengthen the delay.
dataFolderPath: target/dataExchange/
# milliseconds
dataLoadingDelay: 3000
mailjet:
  enabled: false
  base-url: http://localhost:9000
  api-key: test-key
  secret-key: test-secret
  connect-timeout-ms: 1000
  read-timeout-ms: 1000
  sender:
    email: test@example.com
    name: Test
registration:
  confirmation-page-url: http://localhost:3000/confirmEmail
  confirmation-link-validity-hours: 24
  resend-cooldown-seconds: 60
  login-page-url: http://localhost:3000/signIn

password-reset:
  reset-page-url: http://localhost:3000/resetPassword
  link-validity-hours: 1
  request-cooldown-seconds: 60
