spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password: sa
  sql:
    init:
      mode: always

jwt:
  token:
    secret: ffffffff
    validity: 3600000

dataFolderPath: src/test/resources/dataExchange/
# milliseconds
dataLoadingDelay: 3000