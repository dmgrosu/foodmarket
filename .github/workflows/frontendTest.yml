# This workflow will build and test the React frontend
# on push or pull request in dev branch

name: Frontend CI

on:
  push:
    branches: [ dev ]
    paths: [ 'frontend/**' ]
  pull_request:
    branches: [ dev ]
    paths: [ 'frontend/**' ]

jobs:
  build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
    - uses: actions/checkout@v7
    - name: Set up Node 24
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Test with Jest
      run: npm test
      env:
        CI: true
    - name: Build
      run: npm run build
